name: Deploy Órbita to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Extract the uploaded source archive
        run: unzip -q orbita-drop.zip -d app

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build for the GitHub Pages project path
        working-directory: app
        env:
          VITE_SOLAR_API_BASE_URL: https://orbita-explorador.vercel.app
        run: |
          pnpm run typecheck
          pnpm exec vite build --base=/Orbita-explorer/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
